kind = "web"
previewPath = "/"
title = "Dukanen Marketplace"
version = "1.0.0"
id = "artifacts/dukanen"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22993

[services.development]
run = "pnpm --filter @workspace/dukanen run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dukanen", "run", "build" ]
publicDir = "artifacts/dukanen/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22993"
BASE_PATH = "/"
